            - generic [ref=f5e78]:
              - text: Resources in MCP are designed to be
              - strong [ref=f5e79]: application-driven
              - text: ", with host applications determining how to incorporate context based on their needs."
            - generic [ref=f5e80]: "For example, applications could:"
            - list [ref=f5e81]:
              - listitem [ref=f5e82]: Expose resources through UI elements for explicit selection, in a tree or list view
              - listitem [ref=f5e83]: Allow the user to search through and filter available resources
              - listitem [ref=f5e84]: Implement automatic context inclusion, based on heuristics or the AI model’s selection
            - img "Example of resource context picker" [ref=f5e88]
            - 'button "Expand image: Example of resource context picker"'
