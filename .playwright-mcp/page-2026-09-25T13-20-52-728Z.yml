                - generic [ref=f5e702]: "}"
            - heading "Navigate to header Annotations" [level=3] [ref=f5e703]:
              - link "Navigate to header" [ref=f5e704] [cursor=pointer]:
                - /url: "#annotations"
              - generic [ref=f5e709] [cursor=pointer]: Annotations
            - generic [ref=f5e710]: "Resources, resource templates and content blocks support optional annotations that provide hints to clients about how to use or display the resource:"
            - list [ref=f5e711]:
              - listitem [ref=f5e712]:
                - strong [ref=f5e713]:
                  - code [ref=f5e714]: audience
                - text: ": An array indicating the intended audience(s) for this resource. Valid values are"
                - code [ref=f5e715]: "\"user\""
                - text: and
                - code [ref=f5e716]: "\"assistant\""
                - text: . For example,
                - code [ref=f5e717]: "[\"user\", \"assistant\"]"
                - text: indicates content useful for both.
              - listitem [ref=f5e718]:
                - strong [ref=f5e719]:
                  - code [ref=f5e720]: priority
                - text: ": A number from 0.0 to 1.0 indicating the importance of this resource. A value of 1 means “most important” (effectively required), while 0 means “least important” (entirely optional)."
              - listitem [ref=f5e721]:
                - strong [ref=f5e722]:
                  - code [ref=f5e723]: lastModified
                - text: ": An ISO 8601 formatted timestamp indicating when the resource was last modified (e.g.,"
                - code [ref=f5e724]: "\"2025-01-12T15:00:58Z\""
                - text: ).
            - generic [ref=f5e725]: "Example resource with annotations:"
            - generic [ref=f5e726]:
              - generic [ref=f5e727]:
                - button "Report incorrect code" [ref=f5e729] [cursor=pointer]
                - generic [ref=f5e733]:
                  - button "Copy the contents from the code block" [ref=f5e734] [cursor=pointer]
                  - status [ref=f5e738]
                - button "Ask Assistant" [ref=f5e740] [cursor=pointer]
              - code [ref=f5e747]:
                - generic [ref=f5e748]: "{"
                - generic [ref=f5e749]: "\"uri\": \"file:///project/README.md\","
                - generic [ref=f5e750]: "\"name\": \"README.md\","
                - generic [ref=f5e751]: "\"title\": \"Project Documentation\","
                - generic [ref=f5e752]: "\"mimeType\": \"text/markdown\","
                - generic [ref=f5e753]: "\"annotations\": {"
                - generic [ref=f5e754]: "\"audience\": [\"user\"],"
                - generic [ref=f5e755]: "\"priority\": 0.8,"
                - generic [ref=f5e756]: "\"lastModified\": \"2025-01-12T15:00:58Z\""
                - generic [ref=f5e757]: "}"
                - generic [ref=f5e758]: "}"
            - generic [ref=f5e759]: "Clients can use these annotations to:"
            - list [ref=f5e760]:
              - listitem [ref=f5e761]: Filter resources based on their intended audience
              - listitem [ref=f5e762]: Prioritize which resources to include in context
              - listitem [ref=f5e763]: Display modification times or sort by recency
            - heading "Navigate to header Common URI Schemes" [level=2] [ref=f5e764]:
              - link "Navigate to header" [ref=f5e765] [cursor=pointer]:
                - /url: "#common-uri-schemes"
              - generic [ref=f5e770] [cursor=pointer]: Common URI Schemes
            - generic [ref=f5e771]: The protocol defines several standard URI schemes. This list not exhaustive—implementations are always free to use additional, custom URI schemes.
            - heading "Navigate to header https://" [level=3] [ref=f5e772]:
              - link "Navigate to header" [ref=f5e773] [cursor=pointer]:
                - /url: "#https//"
              - generic [ref=f5e778] [cursor=pointer]: https://
            - generic [ref=f5e779]: Used to represent a resource available on the web.
            - generic [ref=f5e780]:
              - text: Servers
              - strong [ref=f5e781]: SHOULD
              - text: use this scheme only when the client is able to fetch and load the resource directly from the web on its own—that is, it doesn’t need to read the resource via the MCP server.
            - generic [ref=f5e782]:
              - text: For other use cases, servers
              - strong [ref=f5e783]: SHOULD
              - text: prefer to use another URI scheme, or define a custom one, even if the server will itself be downloading resource contents over the internet.
            - heading "Navigate to header file://" [level=3] [ref=f5e784]:
              - link "Navigate to header" [ref=f5e785] [cursor=pointer]:
                - /url: "#file//"
              - generic [ref=f5e790] [cursor=pointer]: file://
            - generic [ref=f5e791]: Used to identify resources that behave like a filesystem. However, the resources do not need to map to an actual physical filesystem.
            - generic [ref=f5e792]:
              - text: MCP servers
              - strong [ref=f5e793]: MAY
              - text: identify file:// resources with an
              - link "XDG MIME type" [ref=f5e794] [cursor=pointer]:
                - /url: https://specifications.freedesktop.org/shared-mime-info-spec/0.14/ar01s02.html#id-1.3.14
              - text: ", like"
              - code [ref=f5e795]: inode/directory
              - text: ", to represent non-regular files (such as directories) that don’t otherwise have a standard MIME type."
            - heading "Navigate to header git://" [level=3] [ref=f5e796]:
              - link "Navigate to header" [ref=f5e797] [cursor=pointer]:
                - /url: "#git//"
              - generic [ref=f5e802] [cursor=pointer]: git://
            - generic [ref=f5e803]: Git version control integration.
            - heading "Navigate to header Custom URI Schemes" [level=3] [ref=f5e804]:
