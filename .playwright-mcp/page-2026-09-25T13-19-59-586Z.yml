          - generic [ref=f2e62]:
            - generic [ref=f2e63]: This page defines what a transport must provide to carry MCP messages, the standard transport bindings, and the requirements for defining new ones.
            - generic [ref=f2e64]:
              - text: Protocol semantics are identical on every transport. A transport is a
              - strong [ref=f2e65]: binding
              - text: ": it defines how messages are framed and delivered, how request metadata is carried, and how cancellation and termination are signaled. It does not define what the messages mean: the"
              - link "message patterns" [ref=f2e66] [cursor=pointer]:
                - /url: /specification/2026-07-28/basic/patterns
              - text: "are part of the core protocol and are the same on every binding. The binding pages specify the standard transports:"
            - list [ref=f2e67]:
              - listitem [ref=f2e68]:
                - link "stdio" [ref=f2e69] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/transports/stdio
                - text: ": newline-delimited messages over the standard streams of a client-launched subprocess."
              - listitem [ref=f2e70]:
                - link "Streamable HTTP" [ref=f2e71] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/transports/streamable-http
                - text: ": each message is an HTTP POST to a single MCP endpoint; replies arrive as a JSON object or a request-scoped SSE stream."
            - generic [ref=f2e72]:
              - text: It is also possible for clients and servers to implement
              - link "custom transports" [ref=f2e73] [cursor=pointer]:
                - /url: "#custom-transports"
              - text: .
            - heading "Navigate to header Messages" [level=2] [ref=f2e74]:
