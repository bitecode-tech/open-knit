              - text: ") identifies a modern server: the client retries with a supported version rather than falling back. Anything else identifies a legacy server."
            - generic [ref=f1e250]:
              - text: The era determination is a property of the server, not of an individual request. Clients
              - strong [ref=f1e251]: SHOULD
