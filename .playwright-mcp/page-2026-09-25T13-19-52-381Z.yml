              - text: clients (which use per-request metadata)
              - strong [ref=f1e238]: MAY
              - text: implement both behaviors.
            - generic [ref=f1e239]: "A client that needs to interoperate with both kinds of servers detects the server’s era with transport-specific mechanics, specified in the binding pages:"
            - list [ref=f1e240]:
