              - generic [ref=f3e833] [cursor=pointer]: Case Sensitivity
            - generic [ref=f3e834]:
              - text: Header names (called “field names” in
              - link "RFC 9110" [ref=f3e835] [cursor=pointer]:
                - /url: https://datatracker.ietf.org/doc/html/rfc9110#name-field-names
              - text: ) are case-insensitive. Clients and servers
              - strong [ref=f3e836]: MUST
              - text: use case-insensitive comparisons for header names. Header
              - emphasis [ref=f3e837]: values
              - text: (such as method names) are case-sensitive.
            - heading "Navigate to header Server Validation" [level=3] [ref=f3e838]:
              - link "Navigate to header" [ref=f3e839] [cursor=pointer]:
                - /url: "#server-validation"
              - generic [ref=f3e844] [cursor=pointer]: Server Validation
            - generic [ref=f3e845]:
              - text: Servers that process the request body
              - strong [ref=f3e846]: MUST
              - text: reject requests where the values specified in the headers do not match the corresponding values in the request body. This prevents potential security vulnerabilities when different components in the network rely on different sources of truth (e.g., a load balancer routing on the header value while the MCP server executes based on the body value).
            - note "Note" [ref=f3e847]:
              - generic [ref=f3e852]:
                - text: When validating integer parameter values, servers
                - strong [ref=f3e853]: SHOULD
                - text: compare the header value and the body value numerically rather than as strings (e.g.,
                - code [ref=f3e854]: "42.0"
                - text: and
                - code [ref=f3e855]: "42"
                - text: are considered equal).
            - generic [ref=f3e856]:
              - text: When rejecting a request due to header validation failure, servers
              - strong [ref=f3e857]: MUST
              - text: return HTTP status
              - code [ref=f3e858]: 400 Bad Request
              - text: and
              - strong [ref=f3e859]: MUST
              - text: "include a JSON-RPC error response using the following error code:"
            - region "Scrollable table" [ref=f3e860]:
              - table [ref=f3e862]:
                - rowgroup [ref=f3e863]:
                  - row [ref=f3e864]:
                    - columnheader "Code" [ref=f3e865]
                    - columnheader "Name" [ref=f3e866]
                    - columnheader "Description" [ref=f3e867]
                - rowgroup [ref=f3e868]:
                  - row [ref=f3e869]:
                    - cell [ref=f3e870]:
                      - code [ref=f3e871]: "-32020"
                    - cell [ref=f3e872]:
                      - link [ref=f3e873] [cursor=pointer]:
                        - /url: /specification/2026-07-28/schema#headermismatcherror
                        - code [ref=f3e874]: HeaderMismatch
                    - cell "The HTTP headers do not match the corresponding values in the request body, or required headers are missing/malformed." [ref=f3e875]
            - generic [ref=f3e876]:
              - text: This error code is allocated from the sub-range the MCP specification reserves for protocol-defined errors. See
              - link "Error Codes" [ref=f3e877] [cursor=pointer]:
