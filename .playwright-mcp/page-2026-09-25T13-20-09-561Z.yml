            - generic [ref=f3e49]:
              - heading "Streamable HTTP" [level=1] [ref=f3e50]
              - generic [ref=f3e51]:
                - button "Copy page" [ref=f3e52] [cursor=pointer]
                - button "More actions" [ref=f3e59] [cursor=pointer]
          - generic [ref=f3e62]:
            - note "Info" [ref=f3e63]:
              - generic [ref=f3e68]:
                - text: Streamable HTTP was introduced in protocol version 2025-03-26 as a replacement for the
                - link "HTTP+SSE transport" [ref=f3e69] [cursor=pointer]:
                  - /url: /specification/2024-11-05/basic/transports#http-with-sse
                - text: from protocol version 2024-11-05.
            - note "Info" [ref=f3e70]:
              - generic [ref=f3e74]:
                - generic [ref=f3e75]: "Revision 2026-07-28 changed the behavior of Streamable HTTP. Clients must ensure they handle backwards compatibility correctly. Changes included:"
                - list [ref=f3e76]:
                  - listitem [ref=f3e77]: Removal of the GET stream endpoint.
                  - listitem [ref=f3e78]: Removal of protocol-level sessions.
                - generic [ref=f3e79]:
                  - text: See the
                  - link "changelog" [ref=f3e80] [cursor=pointer]:
                    - /url: /specification/2026-07-28/changelog
                  - text: and
                  - link "Backward Compatibility" [ref=f3e81] [cursor=pointer]:
                    - /url: "#backward-compatibility"
                  - text: below.
            - generic [ref=f3e82]:
              - text: In the
              - strong [ref=f3e83]: Streamable HTTP
              - text: "transport, the server operates as an independent process that can handle multiple client connections. At a glance:"
            - list [ref=f3e84]:
              - listitem [ref=f3e85]:
                - text: The server exposes a single HTTP endpoint (the
                - strong [ref=f3e86]: MCP endpoint
                - text: ) that accepts POST.
              - listitem [ref=f3e87]: The client sends every JSON-RPC request or notification as its own HTTP POST.
              - listitem [ref=f3e88]:
                - text: The server answers each request with either a single JSON object or a
                - link "Server-Sent Events" [ref=f3e89] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Server-sent_events
                - text: (SSE) stream scoped to that request, carrying request-related notifications followed by the final response.
              - listitem [ref=f3e90]:
                - text: Server-to-client interactions (sampling, elicitation, roots) are embedded in results as input requests per
                - link "Multi Round-Trip Requests (MRTR)" [ref=f3e91] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/mrtr
                - text: (
                - link "SEP-2322" [ref=f3e92] [cursor=pointer]:
                  - /url: /seps/2322-MRTR
                - text: ).
              - listitem [ref=f3e93]:
                - text: Long-lived change notifications (such as list changes and resource updates) are delivered on the response stream of a
                - link [ref=f3e94] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/subscriptions
                  - code [ref=f3e95]: subscriptions/listen
                - text: request.
            - generic [ref=f3e96]:
              - text: See
              - link "Message Flow" [ref=f3e97] [cursor=pointer]:
                - /url: "#message-flow"
              - text: for sequence diagrams of these interactions.
            - generic [ref=f3e98]:
              - text: The server
              - strong [ref=f3e99]: MUST
              - text: provide a single HTTP endpoint path (hereafter referred to as the
              - strong [ref=f3e100]: MCP endpoint
              - text: ) that supports POST. For example, this could be a URL like
              - code [ref=f3e101]: https://example.com/mcp
              - text: .
            - heading "Navigate to header Security & Endpoint" [level=2] [ref=f3e102]:
              - link "Navigate to header" [ref=f3e103] [cursor=pointer]:
                - /url: "#security-&-endpoint"
              - generic [ref=f3e108] [cursor=pointer]: Security & Endpoint
            - generic [ref=f3e109]: "When implementing Streamable HTTP transport:"
            - list [ref=f3e110]:
              - listitem [ref=f3e111]:
                - text: Servers
                - strong [ref=f3e112]: MUST
                - text: validate the
                - code [ref=f3e113]: Origin
                - text: header on all incoming connections to prevent DNS rebinding attacks.
                - list [ref=f3e114]:
                  - listitem [ref=f3e115]:
                    - text: If the
                    - code [ref=f3e116]: Origin
                    - text: header is present and invalid, servers
                    - strong [ref=f3e117]: MUST
                    - text: respond with HTTP 403 Forbidden. The HTTP response body
                    - strong [ref=f3e118]: MAY
                    - text: comprise a JSON-RPC
                    - emphasis [ref=f3e119]: error response
                    - text: that has no
                    - code [ref=f3e120]: id
                    - text: .
              - listitem [ref=f3e121]:
                - text: When running locally, servers
                - strong [ref=f3e122]: SHOULD
                - text: bind only to localhost (127.0.0.1) rather than all network interfaces (0.0.0.0).
              - listitem [ref=f3e123]:
                - text: Servers
                - strong [ref=f3e124]: SHOULD
                - text: implement proper authentication for all connections.
            - generic [ref=f3e125]: Without these protections, attackers could use DNS rebinding to interact with local MCP servers from remote websites.
            - heading "Navigate to header Sending Messages" [level=2] [ref=f3e126]:
              - link "Navigate to header" [ref=f3e127] [cursor=pointer]:
                - /url: "#sending-messages"
              - generic [ref=f3e132] [cursor=pointer]: Sending Messages
            - generic [ref=f3e133]:
              - text: Every JSON-RPC message sent from the client
              - strong [ref=f3e134]: MUST
              - text: be a new HTTP POST request to the MCP endpoint.
            - list [ref=f3e135]:
              - listitem [ref=f3e136]:
                - text: The client
                - strong [ref=f3e137]: MUST
                - text: use HTTP POST to send JSON-RPC messages.
              - listitem [ref=f3e138]:
                - text: The client
                - strong [ref=f3e139]: MUST
                - text: include an
                - code [ref=f3e140]: Accept
                - text: header listing both
                - code [ref=f3e141]: application/json
                - text: and
                - code [ref=f3e142]: text/event-stream
                - text: as supported content types.
              - listitem [ref=f3e143]:
                - text: The client
                - strong [ref=f3e144]: MUST
                - text: include the
                - link "request metadata headers" [ref=f3e145] [cursor=pointer]:
                  - /url: "#request-metadata"
                - text: on each POST request.
              - listitem [ref=f3e146]:
                - text: The body of the HTTP POST
                - strong [ref=f3e147]: MUST
                - text: be a single JSON-RPC
                - emphasis [ref=f3e148]: request
                - text: or
                - emphasis [ref=f3e149]: notification
                - text: . The client
                - strong [ref=f3e150]: MUST NOT
                - text: send JSON-RPC
                - emphasis [ref=f3e151]: responses
                - text: .
              - listitem [ref=f3e152]:
                - text: If the body is a JSON-RPC
                - emphasis [ref=f3e153]: notification
                - text: ":"
                - list [ref=f3e154]:
                  - listitem [ref=f3e155]:
                    - text: If the server accepts it, the server
                    - strong [ref=f3e156]: MUST
                    - text: return HTTP status code
                    - code [ref=f3e157]: 202 Accepted
                    - text: with no body.
                  - listitem [ref=f3e158]:
                    - text: If the server cannot accept it, it
                    - strong [ref=f3e159]: MUST
                    - text: return an HTTP error status code (e.g.,
                    - code [ref=f3e160]: 400 Bad Request
                    - text: ). The HTTP response body
                    - strong [ref=f3e161]: MAY
                    - text: comprise a JSON-RPC
                    - emphasis [ref=f3e162]: error response
                    - text: that has no
                    - code [ref=f3e163]: id
                    - text: .
              - listitem [ref=f3e164]:
                - text: If the body is a JSON-RPC
                - emphasis [ref=f3e165]: request
                - text: ", the server"
                - strong [ref=f3e166]: MUST
                - text: return either
                - code [ref=f3e167]: "Content-Type: application/json"
                - text: (a single JSON object) or
                - code [ref=f3e168]: "Content-Type: text/event-stream"
                - text: (an SSE response stream). The client
                - strong [ref=f3e169]: MUST
                - text: support both.
            - note "Note" [ref=f3e170]:
              - generic [ref=f3e175]:
                - text: This revision of the core protocol defines no client-to-server
                - emphasis [ref=f3e176]: notifications
                - text: over Streamable HTTP. The only client-sent notification in the core protocol,
                - code [ref=f3e177]: notifications/cancelled
                - text: ", is used only on the"
                - link "stdio" [ref=f3e178] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/transports/stdio
                - text: transport; on Streamable HTTP, closing the SSE response stream is itself the cancellation signal and no
                - code [ref=f3e179]: notifications/cancelled
                - text: message is expected (see
                - link "Cancellation" [ref=f3e180] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/cancellation
                - text: ). The notification rules above describe the transport mechanics for a notification POST; header requirements for notification POSTs are not defined by this revision.
            - heading "Navigate to header Receiving Messages" [level=2] [ref=f3e181]:
              - link "Navigate to header" [ref=f3e182] [cursor=pointer]:
                - /url: "#receiving-messages"
              - generic [ref=f3e187] [cursor=pointer]: Receiving Messages
            - generic [ref=f3e188]:
              - text: When the server returns an SSE response stream (
              - code [ref=f3e189]: "Content-Type: text/event-stream"
              - text: "):"
            - list [ref=f3e190]:
              - listitem [ref=f3e191]:
                - text: The server
                - strong [ref=f3e192]: MAY
                - text: send JSON-RPC
                - emphasis [ref=f3e193]: notifications
                - text: — for example,
                - link [ref=f3e194] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/progress
                  - code [ref=f3e195]: notifications/progress
                - text: or
                - link [ref=f3e196] [cursor=pointer]:
                  - /url: /specification/2026-07-28/server/utilities/logging
                  - code [ref=f3e197]: notifications/message
                - text: — before the final response. These notifications
                - strong [ref=f3e198]: MUST
                - text: relate to the originating client request.
              - listitem [ref=f3e199]:
                - text: The server
                - strong [ref=f3e200]: MUST NOT
                - text: send independent JSON-RPC
                - emphasis [ref=f3e201]: requests
                - text: on this stream. Server-to-client interactions (sampling, elicitation, list-roots) are embedded as input requests inside an
                - link [ref=f3e202] [cursor=pointer]:
                  - /url: /specification/2026-07-28/schema#inputrequiredresult
                  - code [ref=f3e203]: InputRequiredResult
                - text: per
                - link "MRTR" [ref=f3e204] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/mrtr
                - text: (
                - link "SEP-2322" [ref=f3e205] [cursor=pointer]:
                  - /url: /seps/2322-MRTR
                - text: ), not delivered as separate requests on this or any other stream. This is a change from Streamable HTTP in protocol versions
                - code [ref=f3e206]: 2025-03-26
                - text: through
                - code [ref=f3e207]: 2025-11-25
                - text: ", where servers could send such requests on SSE streams."
              - listitem [ref=f3e208]:
                - text: The final JSON-RPC
                - emphasis [ref=f3e209]: response
                - strong [ref=f3e210]: SHOULD
                - text: terminate the stream.
            - generic [ref=f3e211]:
              - text: Long-lived notification streams are obtained by sending a
              - link [ref=f3e212] [cursor=pointer]:
                - /url: /specification/2026-07-28/basic/patterns/subscriptions
                - code [ref=f3e213]: subscriptions/listen
              - text: request. The server’s response is itself an SSE stream that stays open and delivers the change notifications the client opted in to (such as
              - code [ref=f3e214]: notifications/tools/list_changed
              - text: or
              - code [ref=f3e215]: notifications/resources/updated
              - text: ). Request-scoped notifications like
              - code [ref=f3e216]: notifications/progress
              - text: and
              - code [ref=f3e217]: notifications/message
              - text: are
              - strong [ref=f3e218]: not
              - text: delivered on the listen stream — they flow only on the response stream of the request they relate to.
            - generic [ref=f3e219]:
              - text: When initiating an SSE stream, servers
              - strong [ref=f3e220]: SHOULD
              - text: include the
              - code [ref=f3e221]: "X-Accel-Buffering: no"
              - text: header in the HTTP response. This instructs reverse proxies (such as nginx) to disable response buffering, ensuring that SSE events are delivered to clients immediately rather than being held in a buffer. Without this header, proxies may accumulate messages before sending them to the client, introducing unwanted latency and potentially breaking the real-time nature of SSE communication.
            - note "Note" [ref=f3e222]:
              - generic [ref=f3e227]:
                - text: For long-lived streams — in particular the
                - link [ref=f3e228] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/patterns/subscriptions
                  - code [ref=f3e229]: subscriptions/listen
                - text: response stream — servers are encouraged to periodically emit an SSE comment line (a line beginning with a colon, e.g.
                - code [ref=f3e230]: :\r\n
                - text: ) as a keep-alive. This keeps the connection from being closed by intermediaries or client idle timeouts during quiet periods when no notifications are flowing. Per the
                - link "SSE specification" [ref=f3e231] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Server-sent_events
                - text: ", any line beginning with a colon is a comment that carries no event data; clients must ignore such lines and must not treat them as malformed input."
            - generic [ref=f3e232]:
              - text: Resumable SSE streams via
              - code [ref=f3e233]: Last-Event-ID
              - text: are not supported.
            - heading "Navigate to header Message Flow" [level=2] [ref=f3e234]:
              - link "Navigate to header" [ref=f3e235] [cursor=pointer]:
                - /url: "#message-flow"
              - generic [ref=f3e240] [cursor=pointer]: Message Flow
            - generic [ref=f3e241]: The following diagrams illustrate the message flows on a single MCP endpoint.
            - generic [ref=f3e242]:
              - strong [ref=f3e243]: Requests and responses.
              - text: "Each request is its own POST; the server chooses per request whether to respond with a single JSON object or an SSE stream:"
            - generic [ref=f3e244]:
              - strong [ref=f3e245]: Server-to-client interactions (MRTR).
              - text: When the server needs input from the client — sampling, elicitation, or roots — it does not send its own JSON-RPC request. It returns an
              - link [ref=f3e246] [cursor=pointer]:
                - /url: /specification/2026-07-28/schema#inputrequiredresult
                - code [ref=f3e247]: InputRequiredResult
              - text: containing
              - code [ref=f3e248]: inputRequests
              - text: ", and the client retries the original request with the matching"
              - code [ref=f3e249]: inputResponses
              - text: (see
              - link "Multi Round-Trip Requests" [ref=f3e250] [cursor=pointer]:
                - /url: /specification/2026-07-28/basic/patterns/mrtr
              - text: "):"
            - generic [ref=f3e251]:
              - strong [ref=f3e252]: Change notifications.
              - text: Clients that want server-initiated change notifications open a long-lived stream with
              - link [ref=f3e253] [cursor=pointer]:
                - /url: /specification/2026-07-28/basic/patterns/subscriptions
                - code [ref=f3e254]: subscriptions/listen
              - text: "; the response stream stays open and carries only the notification types the client opted in to:"
            - heading "Navigate to header Cancellation" [level=2] [ref=f3e255]:
              - link "Navigate to header" [ref=f3e256] [cursor=pointer]:
                - /url: "#cancellation"
              - generic [ref=f3e261] [cursor=pointer]: Cancellation
            - generic [ref=f3e262]:
              - text: Closing the SSE response stream
              - strong [ref=f3e263]: MUST
              - text: be treated by the server as cancellation of that request. Because each request has its own response stream, the transport-level disconnect is unambiguous. The server
              - strong [ref=f3e264]: SHOULD
              - text: stop work on the cancelled request as soon as practical and
              - strong [ref=f3e265]: MUST NOT
              - text: send any further messages for it. See
              - link "Cancellation" [ref=f3e266] [cursor=pointer]:
                - /url: /specification/2026-07-28/basic/patterns/cancellation
              - text: for the full rules.
            - heading "Navigate to header Request Metadata" [level=2] [ref=f3e267]:
              - link "Navigate to header" [ref=f3e268] [cursor=pointer]:
                - /url: "#request-metadata"
              - generic [ref=f3e273] [cursor=pointer]: Request Metadata
            - generic [ref=f3e274]: The Streamable HTTP transport mirrors selected JSON-RPC body fields into HTTP headers so that intermediaries (load balancers, gateways, observability tooling) can route and inspect requests without parsing the body.
            - heading "Navigate to header Protocol Version Header" [level=3] [ref=f3e275]:
              - link "Navigate to header" [ref=f3e276] [cursor=pointer]:
                - /url: "#protocol-version-header"
              - generic [ref=f3e281] [cursor=pointer]: Protocol Version Header
            - generic [ref=f3e282]:
              - text: Every POST request to the MCP endpoint
              - strong [ref=f3e283]: MUST
              - text: include an
              - code [ref=f3e284]: MCP-Protocol-Version
              - text: header.
            - generic [ref=f3e285]:
              - text: "For example:"
              - code [ref=f3e286]: "MCP-Protocol-Version: 2026-07-28"
            - generic [ref=f3e287]:
              - text: The header value
              - strong [ref=f3e288]: MUST
              - text: match the
              - code [ref=f3e289]: io.modelcontextprotocol/protocolVersion
              - text: field carried in the request body’s
              - code [ref=f3e290]: _meta
              - text: . If the values do not match, the server
              - strong [ref=f3e291]: MUST
              - text: reject the request with
              - code [ref=f3e292]: 400 Bad Request
              - text: and a
              - code [ref=f3e293]: HeaderMismatch
              - text: JSON-RPC error (see
              - link "Server Validation" [ref=f3e294] [cursor=pointer]:
                - /url: "#server-validation"
              - text: ).
            - generic [ref=f3e295]:
              - text: If the server does not implement the requested protocol version (whether the version is unknown to the server, or is a known version the server has chosen not to support), it
              - strong [ref=f3e296]: MUST
              - text: respond with
              - code [ref=f3e297]: 400 Bad Request
              - text: and an
              - link [ref=f3e298] [cursor=pointer]:
                - /url: /specification/2026-07-28/schema#unsupportedprotocolversionerror
                - code [ref=f3e299]: UnsupportedProtocolVersionError
              - text: listing its supported versions. See
              - 'link "Versioning: Protocol Version Negotiation" [ref=f3e300] [cursor=pointer]':
                - /url: /specification/2026-07-28/basic/versioning#protocol-version-negotiation
              - text: for the negotiation flow.
            - generic [ref=f3e301]:
              - text: If the server does not implement the requested RPC method, it
              - strong [ref=f3e302]: MUST
              - text: respond with
              - code [ref=f3e303]: 404 Not Found
              - text: and a JSON-RPC error with code
              - code [ref=f3e304]: "-32601"
              - text: (
              - code [ref=f3e305]: Method not found
              - text: ). The JSON-RPC error body distinguishes this case from a
              - code [ref=f3e306]: "404"
              - text: returned by a legacy
              - link "HTTP+SSE" [ref=f3e307] [cursor=pointer]:
                - /url: /specification/2024-11-05/basic/transports#http-with-sse
              - text: server that does not host the modern MCP endpoint (see
              - link "Backward Compatibility" [ref=f3e308] [cursor=pointer]:
                - /url: "#backward-compatibility"
              - text: ).
            - generic [ref=f3e309]:
              - text: A server that supports clients implementing protocol versions earlier than
              - code [ref=f3e310]: 2025-06-18
              - text: (which did not define the
              - code [ref=f3e311]: MCP-Protocol-Version
              - text: header)
              - strong [ref=f3e312]: MAY
              - text: treat a request that omits the header as protocol version
              - code [ref=f3e313]: 2025-03-26
              - text: . A server that does not support such clients
              - strong [ref=f3e314]: MUST
              - text: reject a request without the header per
              - link "Server Validation" [ref=f3e315] [cursor=pointer]:
                - /url: "#server-validation"
              - text: .
            - heading "Navigate to header Standard Request Headers" [level=3] [ref=f3e316]:
              - link "Navigate to header" [ref=f3e317] [cursor=pointer]:
                - /url: "#standard-request-headers"
              - generic [ref=f3e322] [cursor=pointer]: Standard Request Headers
            - region "Scrollable table" [ref=f3e323]:
              - table [ref=f3e325]:
                - rowgroup [ref=f3e326]:
                  - row [ref=f3e327]:
                    - columnheader "Header Name" [ref=f3e328]
                    - columnheader "Source Field" [ref=f3e329]
                    - columnheader "Required For" [ref=f3e330]
                - rowgroup [ref=f3e331]:
                  - row [ref=f3e332]:
                    - cell [ref=f3e333]:
                      - code [ref=f3e334]: Mcp-Method
                    - cell [ref=f3e335]:
                      - code [ref=f3e336]: method
                    - cell "All requests" [ref=f3e337]
                  - row [ref=f3e338]:
                    - cell [ref=f3e339]:
                      - code [ref=f3e340]: Mcp-Name
                    - cell [ref=f3e341]:
                      - code [ref=f3e342]: params.name
                      - text: or
                      - code [ref=f3e343]: params.uri
                    - cell [ref=f3e344]:
                      - code [ref=f3e345]: tools/call
                      - text: ","
                      - code [ref=f3e346]: resources/read
                      - text: ","
                      - code [ref=f3e347]: prompts/get
                      - text: requests
            - generic [ref=f3e348]:
              - text: These headers are
              - strong [ref=f3e349]: REQUIRED
              - text: for compliance.
            - generic [ref=f3e350]:
              - text: If the
              - code [ref=f3e351]: Mcp-Name
              - text: source value cannot be safely represented as a plain ASCII header value, clients
              - strong [ref=f3e352]: MUST
              - text: encode it using the Base64 sentinel format described in
              - link "Value Encoding" [ref=f3e353] [cursor=pointer]:
                - /url: "#value-encoding"
              - text: .
            - strong [ref=f3e355]:
              - code [ref=f3e356]: tools/call
              - text: "request:"
            - generic [ref=f3e357]:
              - generic [ref=f3e358]:
                - button "Report incorrect code" [ref=f3e360] [cursor=pointer]
                - generic [ref=f3e364]:
                  - button "Copy the contents from the code block" [ref=f3e365] [cursor=pointer]
                  - status [ref=f3e369]
                - button "Ask Assistant" [ref=f3e371] [cursor=pointer]
