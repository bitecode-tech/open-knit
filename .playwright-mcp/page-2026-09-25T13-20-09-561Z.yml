              - text: headers are missing or do not match the body, the client
              - strong [ref=f3e777]: SHOULD
              - text: call
              - code [ref=f3e778]: tools/list
              - text: to check for changes to the tool’s
              - code [ref=f3e779]: inputSchema
              - text: ", then retry the original request with the appropriate headers."
