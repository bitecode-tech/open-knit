                  - status [ref=f3e656]
                - button "Ask Assistant" [ref=f3e658] [cursor=pointer]
              - code [ref=f3e665]:
                - generic [ref=f3e666]: "Mcp-Param-{Name}: =?base64?{Base64EncodedValue}?="
            - generic [ref=f3e667]:
              - text: The same encoding rule applies to the
              - code [ref=f3e668]: Mcp-Name
              - text: header value. Tool and prompt names are only
              - strong [ref=f3e669]: SHOULD
              - text: "-constrained to header-safe characters, so a name (or resource URI) outside the safe set is carried as:"
            - generic [ref=f3e670]:
