            - generic [ref=f3e787]:
              - text: Intermediate servers that do not recognize an
              - code [ref=f3e788]: "Mcp-Param-{Name}"
              - text: header
              - strong [ref=f3e789]: MUST
              - text: forward it and otherwise ignore it, as required by the
              - link "HTTP Semantics RFC" [ref=f3e790] [cursor=pointer]:
