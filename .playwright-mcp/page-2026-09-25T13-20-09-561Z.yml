                - text: ).
              - listitem [ref=f3e769]:
                - text: Encode the values according to the
                - link "Value Encoding" [ref=f3e770] [cursor=pointer]:
                  - /url: "#value-encoding"
                - text: rules.
              - listitem [ref=f3e771]:
