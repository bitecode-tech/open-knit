            - generic [ref=f3e693]:
              - text: The prefix
              - code [ref=f3e694]: =?base64?
              - text: and suffix
              - code [ref=f3e695]: "?="
              - text: indicate that the value is Base64-encoded. These markers are case-sensitive and
              - strong [ref=f3e696]: MUST
              - text: appear exactly as shown (lowercase). Servers and intermediaries that need to inspect these values
              - strong [ref=f3e697]: MUST
              - text: decode them accordingly. In particular, servers
              - strong [ref=f3e698]: MUST
              - text: decode an encoded
              - code [ref=f3e699]: Mcp-Name
              - text: or
              - code [ref=f3e700]: "Mcp-Param-{Name}"
              - text: value before comparing it to the corresponding request body value during
              - link "Server Validation" [ref=f3e701] [cursor=pointer]:
