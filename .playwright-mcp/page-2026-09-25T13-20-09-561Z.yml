                - generic [ref=f3e904]: "\"id\": 1,"
                - generic [ref=f3e905]: "\"error\": {"
                - generic [ref=f3e906]: "\"code\": -32020,"
                - generic [ref=f3e907]: "\"message\": \"Header mismatch: Mcp-Name header value 'foo' does not match body value 'bar'\""
                - generic [ref=f3e908]: "}"
                - generic [ref=f3e909]: "}"
            - generic [ref=f3e910]: "Validation failure conditions include:"
            - list [ref=f3e911]:
              - listitem [ref=f3e912]:
                - text: A required standard header (
                - code [ref=f3e913]: MCP-Protocol-Version
                - text: ","
                - code [ref=f3e914]: Mcp-Method
                - text: ","
                - code [ref=f3e915]: Mcp-Name
                - text: ) is missing.
              - listitem [ref=f3e916]:
                - text: A header value does not match the corresponding request body value. For headers that permit the Base64 sentinel encoding (
                - code [ref=f3e917]: Mcp-Name
                - text: and
                - code [ref=f3e918]: "Mcp-Param-{Name}"
                - text: ), servers
                - strong [ref=f3e919]: MUST
                - text: decode encoded values (see
                - link "Value Encoding" [ref=f3e920] [cursor=pointer]:
                  - /url: "#value-encoding"
                - text: ) before comparing them to the body value.
              - listitem [ref=f3e921]: A header value contains invalid characters.
            - note "Note" [ref=f3e922]:
              - generic [ref=f3e927]:
                - text: Intermediaries
                - strong [ref=f3e928]: MUST
                - text: return an appropriate HTTP error status (e.g.,
                - code [ref=f3e929]: 400 Bad Request
                - text: ) for validation failures but are not required to return a JSON-RPC error response.
            - note "Note" [ref=f3e930]:
              - generic [ref=f3e935]:
                - text: Intermediaries that enforce policy based on mirrored headers (e.g., routing or rate-limiting by tenant)
                - strong [ref=f3e936]: SHOULD
                - text: verify that the
                - code [ref=f3e937]: MCP-Protocol-Version
                - text: header indicates a version that requires header–body validation. If the version is older or the header is absent, the intermediary
                - strong [ref=f3e938]: SHOULD
                - text: reject the request rather than trusting unvalidated header values.
            - heading "Navigate to header Backward Compatibility" [level=2] [ref=f3e939]:
              - link "Navigate to header" [ref=f3e940] [cursor=pointer]:
                - /url: "#backward-compatibility"
              - generic [ref=f3e945] [cursor=pointer]: Backward Compatibility
            - generic [ref=f3e946]:
              - text: A client that supports both modern (per-request-metadata) MCP versions and a legacy version that requires an
              - code [ref=f3e947]: initialize
              - text: handshake
              - strong [ref=f3e948]: MAY
              - text: detect which era the server implements by attempting a modern request first. On
              - code [ref=f3e949]: 400 Bad Request
              - text: ", the client"
              - strong [ref=f3e950]: SHOULD
              - text: "inspect the response body before falling back: modern servers also use"
              - code [ref=f3e951]: "400"
              - text: for
              - link [ref=f3e952] [cursor=pointer]:
                - /url: /specification/2026-07-28/schema#unsupportedprotocolversionerror
                - code [ref=f3e953]: UnsupportedProtocolVersionError
              - text: ","
              - code [ref=f3e954]: MissingRequiredClientCapabilityError
              - text: ", and header-validation failures."
            - list [ref=f3e955]:
              - listitem [ref=f3e956]:
                - text: If the body contains a recognized modern JSON-RPC error, the server speaks a modern version of MCP — retry using the advertised
                - code [ref=f3e957]: supported
                - text: versions or correct the request, rather than falling back.
              - listitem [ref=f3e958]:
                - text: If the body is empty or is not a recognized modern JSON-RPC error, fall back to
                - code [ref=f3e959]: initialize
                - text: and continue with the legacy version for subsequent requests.
            - generic [ref=f3e960]:
              - text: See
              - 'link "Versioning: Backward Compatibility" [ref=f3e961] [cursor=pointer]':
                - /url: /specification/2026-07-28/basic/versioning#backward-compatibility-with-initialization-based-versions
              - text: for the era model and a compatibility matrix for implementors.
            - heading "Navigate to header Earlier Streamable HTTP Revisions" [level=3] [ref=f3e962]:
              - link "Navigate to header" [ref=f3e963] [cursor=pointer]:
                - /url: "#earlier-streamable-http-revisions"
              - generic [ref=f3e968] [cursor=pointer]: Earlier Streamable HTTP Revisions
            - generic [ref=f3e969]:
              - text: Protocol versions
              - code [ref=f3e970]: 2025-03-26
              - text: through
              - link [ref=f3e971] [cursor=pointer]:
                - /url: /specification/2025-11-25/basic/transports
                - code [ref=f3e972]: 2025-11-25
              - text: "also used the Streamable HTTP transport, but in a different shape: servers could assign a session via the"
              - code [ref=f3e973]: Mcp-Session-Id
              - text: header (terminated with HTTP DELETE), clients could open a standalone SSE stream with HTTP GET to receive server-initiated messages, servers could send JSON-RPC
              - emphasis [ref=f3e974]: requests
              - text: on SSE streams, and streams were resumable via
              - code [ref=f3e975]: Last-Event-ID
              - text: . None of these mechanisms are part of this revision.
            - generic [ref=f3e976]:
              - text: A server that supports only this revision and receives such traffic from an older client
              - strong [ref=f3e977]: SHOULD
              - text: "respond as follows:"
            - list [ref=f3e978]:
              - listitem [ref=f3e979]:
                - text: "HTTP GET or DELETE to the MCP endpoint: respond with"
                - code [ref=f3e980]: 405 Method Not Allowed
                - text: .
              - listitem [ref=f3e981]:
                - text: An
                - code [ref=f3e982]: Mcp-Session-Id
                - text: "header on a request: ignore it, and do not mint or echo session IDs."
              - listitem [ref=f3e983]:
                - text: A
                - code [ref=f3e984]: Last-Event-ID
                - text: "header: ignore it; streams are not resumable."
            - generic [ref=f3e985]:
              - text: Servers and clients that need to interoperate with counterparts speaking those protocol versions implement the behavior described in the corresponding revision (for example,
              - 'link "2025-11-25: Streamable HTTP" [ref=f3e986] [cursor=pointer]':
                - /url: /specification/2025-11-25/basic/transports#streamable-http
              - text: ), in addition to the version-negotiation fallback described above.
            - heading "Navigate to header HTTP+SSE Transport (2024-11-05)" [level=3] [ref=f3e987]:
              - link "Navigate to header" [ref=f3e988] [cursor=pointer]:
                - /url: "#http+sse-transport-2024-11-05"
              - generic [ref=f3e993] [cursor=pointer]: HTTP+SSE Transport (2024-11-05)
            - note "Warning" [ref=f3e994]:
              - generic [ref=f3e999]:
                - strong [ref=f3e1000]: Deprecated
                - text: ": The"
                - link "HTTP+SSE transport" [ref=f3e1001] [cursor=pointer]:
                  - /url: /specification/2024-11-05/basic/transports#http-with-sse
                - text: from protocol version 2024-11-05 has been deprecated since protocol version
                - code [ref=f3e1002]: 2025-03-26
                - text: and is classified as Deprecated under the
                - link "feature lifecycle policy" [ref=f3e1003] [cursor=pointer]:
                  - /url: /community/feature-lifecycle#deprecating-a-feature
                - text: (
                - link "SEP-2596" [ref=f3e1004] [cursor=pointer]:
                  - /url: https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2596
                - text: ). New implementations
                - strong [ref=f3e1005]: SHOULD NOT
                - text: adopt it; existing implementations
                - strong [ref=f3e1006]: SHOULD
                - text: migrate to
                - link "Streamable HTTP" [ref=f3e1007] [cursor=pointer]:
                  - /url: /specification/2026-07-28/basic/transports/streamable-http
                - text: . It is eligible for removal in a future revision; see the
                - link "deprecated features registry" [ref=f3e1008] [cursor=pointer]:
                  - /url: /specification/2026-07-28/deprecated
                - text: .
            - generic [ref=f3e1009]:
              - text: Clients and servers can maintain backward compatibility with the deprecated
              - link "HTTP+SSE transport" [ref=f3e1010] [cursor=pointer]:
                - /url: /specification/2024-11-05/basic/transports#http-with-sse
              - text: "(from protocol version 2024-11-05) as follows:"
            - generic [ref=f3e1011]:
              - strong [ref=f3e1012]: Servers
              - text: "wanting to support older clients should:"
            - list [ref=f3e1013]:
              - listitem [ref=f3e1014]:
                - text: Continue to host both the SSE and POST endpoints of the old transport, alongside the new “MCP endpoint” defined for the Streamable HTTP transport.
                - list [ref=f3e1015]:
                  - listitem [ref=f3e1016]: It is also possible to combine the old POST endpoint and the new MCP endpoint, but this may introduce unneeded complexity.
            - generic [ref=f3e1017]:
              - strong [ref=f3e1018]: Clients
              - text: "wanting to support older servers should:"
            - list [ref=f3e1019]:
              - listitem [ref=f3e1020]: Accept an MCP server URL from the user, which may point to either a server using the old transport or the new transport.
              - listitem [ref=f3e1021]:
                - text: Attempt to POST a request to the server URL, with an
                - code [ref=f3e1022]: Accept
                - text: "header as defined above:"
                - list [ref=f3e1023]:
                  - listitem [ref=f3e1024]: If it succeeds, the client can assume this is a server supporting the new Streamable HTTP transport.
                  - listitem [ref=f3e1025]:
                    - text: If it fails with HTTP status code
                    - code [ref=f3e1026]: 400 Bad Request
                    - text: ","
                    - code [ref=f3e1027]: 404 Not Found
                    - text: ", or"
                    - code [ref=f3e1028]: 405 Method Not Allowed
                    - strong [ref=f3e1029]: and
                    - text: "the response body is not a recognized modern JSON-RPC error (a modern server returns one for unsupported version, unknown method, or header-validation failure):"
                    - list [ref=f3e1030]:
                      - listitem [ref=f3e1031]:
                        - text: Issue a GET request to the server URL, expecting that this will open an SSE stream and return an
                        - code [ref=f3e1032]: endpoint
                        - text: event as the first event.
                      - listitem [ref=f3e1033]:
                        - text: When the
                        - code [ref=f3e1034]: endpoint
                        - text: event arrives, the client can assume this is a server running the old HTTP+SSE transport, and should use that transport for all subsequent communication.
