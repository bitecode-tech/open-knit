            - generic [ref=f3e626]:
              - text: Clients
              - strong [ref=f3e627]: MUST
              - text: encode parameter values before including them in HTTP headers to ensure safe transmission and prevent injection attacks.
            - generic [ref=f3e628]:
              - strong [ref=f3e629]: Type conversion
              - text: ": Convert the parameter value to its string representation:"
            - list [ref=f3e630]:
              - listitem [ref=f3e631]:
                - code [ref=f3e632]: string
                - text: ": Use the value as-is"
              - listitem [ref=f3e633]:
                - code [ref=f3e634]: integer
                - text: ": Convert to decimal string representation (e.g.,"
                - code [ref=f3e635]: "42"
                - text: ","
                - code [ref=f3e636]: "-7"
                - text: )
              - listitem [ref=f3e637]:
                - code [ref=f3e638]: boolean
                - text: ": Convert to lowercase"
                - code [ref=f3e639]: "\"true\""
                - text: or
                - code [ref=f3e640]: "\"false\""
            - generic [ref=f3e641]:
              - text: Per
              - link "RFC 9110" [ref=f3e642] [cursor=pointer]:
                - /url: https://datatracker.ietf.org/doc/html/rfc9110#name-field-values
              - text: ", HTTP header field values must consist of visible ASCII characters (0x21-0x7E), space (0x20), and horizontal tab (0x09). When a value cannot be safely represented as a plain ASCII header value (e.g., it contains non-ASCII characters, control characters, or has leading/trailing whitespace), clients"
              - strong [ref=f3e643]: MUST
              - text: "use Base64 encoding of the UTF-8 representation with the following format:"
            - generic [ref=f3e644]:
              - generic [ref=f3e645]:
                - button "Report incorrect code" [ref=f3e647] [cursor=pointer]
                - generic [ref=f3e651]:
