              - text: .
            - generic [ref=f3e791]:
              - text: Servers
              - strong [ref=f3e792]: MUST
              - text: reject requests with a recognized
              - code [ref=f3e793]: "Mcp-Param-{Name}"
              - text: header that contains invalid characters (see
              - link "Value Encoding" [ref=f3e794] [cursor=pointer]:
                - /url: "#value-encoding"
              - text: ).
            - generic [ref=f3e795]:
              - text: Any server that processes the message body
              - strong [ref=f3e796]: MUST
              - text: validate that encoded header values, after decoding if Base64-encoded, match the corresponding values in the request body. Servers
              - strong [ref=f3e797]: MUST
              - text: reject requests with a
              - code [ref=f3e798]: 400 Bad Request
              - text: HTTP status and JSON-RPC error code
              - code [ref=f3e799]: "-32020"
              - text: (
