                - text: keys. The chain
                - strong [ref=f3e504]: MUST NOT
                - text: pass through
                - code [ref=f3e505]: items
                - text: (or any other array keyword), composition keywords (
                - code [ref=f3e506]: oneOf
                - text: ","
                - code [ref=f3e507]: anyOf
                - text: ","
                - code [ref=f3e508]: allOf
                - text: ","
                - code [ref=f3e509]: not
                - text: ), conditional keywords (
