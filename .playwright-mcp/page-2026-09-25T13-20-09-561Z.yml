                - code [ref=f3e766]: inputSchema
                - text: for properties marked with
                - code [ref=f3e767]: x-mcp-header
                - text: and extract the value at each annotated property’s exact property path, omitting the header when no value is present (see
                - link "Schema Extension" [ref=f3e768] [cursor=pointer]:
