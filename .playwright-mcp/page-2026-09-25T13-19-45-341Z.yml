              - text: ", the client"
              - strong [ref=e421]: SHOULD
              - text: "initiate shutdown by:"
            - list [ref=e422]:
              - listitem [ref=e423]: First, closing the input stream to the child process (the server)
              - listitem [ref=e424]:
                - text: Waiting for the server to exit, or sending
                - code [ref=e425]: SIGTERM
                - text: if the server does not exit within a reasonable time
              - listitem [ref=e426]:
                - text: Sending
                - code [ref=e427]: SIGKILL
                - text: if the server does not exit within a reasonable time after
                - code [ref=e428]: SIGTERM
            - generic [ref=e429]:
              - text: The server
              - strong [ref=e430]: MAY
              - text: initiate shutdown by closing its output stream to the client and exiting.
