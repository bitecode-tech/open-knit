              - generic [ref=e446] [cursor=pointer]: Timeouts
            - generic [ref=e447]:
              - text: Implementations
              - strong [ref=e448]: SHOULD
              - text: establish timeouts for all sent requests, to prevent hung connections and resource exhaustion. When the request has not received a success or error response within the timeout period, the sender
              - strong [ref=e449]: SHOULD
              - text: issue a
              - link "cancellation notification" [ref=e450] [cursor=pointer]:
                - /url: /specification/2025-11-25/basic/utilities/cancellation
              - text: for that request and stop waiting for a response.
            - generic [ref=e451]:
              - text: SDKs and other middleware
              - strong [ref=e452]: SHOULD
              - text: allow these timeouts to be configured on a per-request basis.
            - generic [ref=e453]:
              - text: Implementations
              - strong [ref=e454]: MAY
              - text: choose to reset the timeout clock when receiving a
              - link "progress notification" [ref=e455] [cursor=pointer]:
                - /url: /specification/2025-11-25/basic/utilities/progress
              - text: corresponding to the request, as this implies that work is actually happening. However, implementations
              - strong [ref=e456]: SHOULD
              - text: always enforce a maximum timeout, regardless of progress notifications, to limit the impact of a misbehaving client or server.
