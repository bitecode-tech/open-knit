              - generic [ref=e410] [cursor=pointer]: Shutdown
            - generic [ref=e411]: "During the shutdown phase, one side (usually the client) cleanly terminates the protocol connection. No specific shutdown messages are defined—instead, the underlying transport mechanism should be used to signal connection termination:"
            - heading "Navigate to header stdio" [level=4] [ref=e412]:
              - link "Navigate to header" [ref=e413] [cursor=pointer]:
                - /url: "#stdio"
              - generic [ref=e418] [cursor=pointer]: stdio
