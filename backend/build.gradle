plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'bitecode'
version = '0.0.9-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

allprojects {
	apply plugin: 'io.spring.dependency-management'

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
		}
		dependencies {
			dependency "com.google.guava:guava:33.7.1-jre"
			dependency "org.apache.commons:commons-lang3:3.20.0"
			dependency "com.github.ben-manes.caffeine:caffeine:3.3.0"
			dependency "org.mapstruct:mapstruct:1.6.3"
			dependency "org.mapstruct:mapstruct-processor:1.6.3"
			dependency "org.mapstruct.extensions.spring:mapstruct-spring-annotations:1.1.3"
			dependency "org.projectlombok:lombok-mapstruct-binding:0.2.0"
			dependency "com.querydsl:querydsl-jpa:5.1.0"
			dependency "com.querydsl:querydsl-apt:5.1.0"
			dependency "io.rest-assured:rest-assured:6.0.1"
			dependency "org.awaitility:awaitility:4.3.0"
			dependency "org.mockito:mockito-inline:5.2.0"
			dependency "org.projectlombok:lombok:1.18.48"
		}
	}

	dependencies {
		components {
			withModule("com.querydsl:querydsl-jpa") { details ->
				details.allVariants {
					withFiles {
						removeAllFiles()
						addFile("querydsl-jpa-${details.id.version}-jakarta.jar")
					}
				}
			}
			withModule("com.querydsl:querydsl-apt") { details ->
				details.allVariants {
					withFiles {
						removeAllFiles()
						addFile("querydsl-apt-${details.id.version}-jakarta.jar")
					}
				}
			}
		}
	}
}

subprojects {
    plugins.withId('java') {
        tasks.named('test') {
            failOnNoDiscoveredTests = false
        }

        sourceSets {
            test {
                java.setSrcDirs(['src/test/unit/java', 'src/test/java'])
                resources.setSrcDirs(['src/test/unit/resources', 'src/test/resources'])
            }
            integrationTest {
                java.setSrcDirs(['src/test/integration/java', 'src/integrationTest/java'])
                resources.setSrcDirs(['src/test/integration/resources', 'src/integrationTest/resources'])
                compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
                runtimeClasspath += output + compileClasspath
            }
        }

        configurations {
            integrationTestImplementation.extendsFrom testImplementation
            integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
            integrationTestCompileOnly.extendsFrom testCompileOnly
            integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
            integrationTestArtifacts
        }

        dependencies {
            add('integrationTestRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
        }

        tasks.register('integrationTest', Test) {
            description = 'Runs integration tests.'
            group = 'verification'
            failOnNoDiscoveredTests = false
            testClassesDirs = sourceSets.integrationTest.output.classesDirs
            classpath = sourceSets.integrationTest.runtimeClasspath
            shouldRunAfter tasks.named('test')
            useJUnitPlatform()
        }

        tasks.register('integrationTestJar', Jar) {
            archiveClassifier.set('integration-tests')
            from sourceSets.integrationTest.output
        }

        artifacts {
            integrationTestArtifacts tasks.named('integrationTestJar')
        }
    }
}

dependencies {
	implementation project(':modules:_common')
	implementation project(':modules:identity')
	implementation project(':modules:ai')
	implementation project(':modules:document')
	implementation project(':modules:ocr')
	implementation project(':modules:payment')
	implementation project(':modules:transaction')
	implementation project(':modules:wallet')

	// spring-web/core
	implementation('org.springframework.boot:spring-boot-starter-webflux')

	// util
	implementation('com.google.guava:guava')
	annotationProcessor('org.projectlombok:lombok')
	compileOnly('org.projectlombok:lombok')

	// test related
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	testImplementation('org.springframework.boot:spring-boot-starter-test')
	testImplementation('org.springframework.boot:spring-boot-starter-webmvc-test')
	testImplementation project(path: ':modules:_common', configuration: 'integrationTestArtifacts')
	testImplementation('org.springframework.security:spring-security-test')
	testImplementation('org.springframework.boot:spring-boot-testcontainers')
	testImplementation("org.testcontainers:testcontainers-postgresql")
	testImplementation('org.testcontainers:testcontainers-junit-jupiter')
	testCompileOnly("org.projectlombok:lombok")
	testAnnotationProcessor("org.projectlombok:lombok")
	testImplementation("io.rest-assured:rest-assured")
	testImplementation("org.awaitility:awaitility")
	testImplementation("org.mockito:mockito-inline")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
	outputs.dir snippetsDir
	failOnNoDiscoveredTests = false
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
